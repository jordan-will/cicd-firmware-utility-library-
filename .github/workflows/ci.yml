name: CI Pipeline

on:
    push:
        branches:
            - main
    
    pull_request:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure build enviroment
              run: |
                gcc --version
                make -- version 
            - name: Compile project
              run: make

            - name: Run tests
              run: make test
